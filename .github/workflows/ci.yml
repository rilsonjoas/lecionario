name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  web:
    name: Web (Lint, TypeCheck, Tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lecionario-web/package-lock.json

      - name: Install dependencies
        working-directory: lecionario-web
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: lecionario-web
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: lecionario-web
        run: npm run lint

      - name: Prettier check
        working-directory: lecionario-web
        run: npx prettier --check "src/**/*.{ts,tsx,json,css,md}"

      - name: Tests
        working-directory: lecionario-web
        run: npm run test

  mobile:
    name: Mobile (Lint, TypeCheck, Tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lecionario-mobile/package-lock.json

      - name: Install dependencies
        working-directory: lecionario-mobile
        run: npm ci

      - name: TypeScript check
        working-directory: lecionario-mobile
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: lecionario-mobile
        run: npm run lint

      - name: Prettier check
        working-directory: lecionario-mobile
        run: npx prettier --check "src/**/*.{ts,tsx,json}"

      - name: Tests
        working-directory: lecionario-mobile
        run: npm run test

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lecionario-web
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: lecionario-web
          file: lecionario-web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
