name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  web:
    name: Web (Lint, TypeCheck, Tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lecionario-web/package-lock.json

      - name: Install dependencies
        working-directory: lecionario-web
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: lecionario-web
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: lecionario-web
        run: npm run lint

      - name: Prettier check
        working-directory: lecionario-web
        run: npx prettier --check "src/**/*.{ts,tsx,json,css,md}"

      - name: Tests
        working-directory: lecionario-web
        run: npm run test

      - name: Validate content (repetição, lacunas, cobertura ARC — Fase 5.1)
        working-directory: lecionario-web
        run: npm run validate:content

      - name: Audit dependencies (production, com allowlist)
        run: node scripts/audit-allowlist.mjs web

  e2e:
    name: Web (E2E + Acessibilidade)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lecionario-web/package-lock.json

      - name: Install dependencies
        working-directory: lecionario-web
        run: npm ci --legacy-peer-deps

      # O webServer do playwright.config.ts sobe o standalone do Next construído
      # aqui — daí o build vir antes. --with-deps instala as libs de sistema que
      # o Chromium headless precisa no runner.
      - name: Install Playwright (Chromium)
        working-directory: lecionario-web
        run: npx playwright install --with-deps chromium

      - name: Build (standalone)
        working-directory: lecionario-web
        run: npm run build

      # Só o spec de acessibilidade entra no gate. O offline.spec.ts está
      # quebrado desde 21/08 por um bug real de navegação offline (a troca de
      # data busca RSC payload e o fetch falha sem rede) — não é regressão do
      # a11y, e por isso fica fora até o bug ser resolvido.
      - name: E2E — acessibilidade (axe-core, WCAG 2.1 A/AA)
        working-directory: lecionario-web
        run: npx playwright test e2e/a11y.spec.ts

      - name: Upload do relatório Playwright (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            lecionario-web/test-results/
            lecionario-web/playwright-report/
          retention-days: 7

  mobile:
    name: Mobile (Lint, TypeCheck, Tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lecionario-mobile/package-lock.json

      - name: Install dependencies
        working-directory: lecionario-mobile
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: lecionario-mobile
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: lecionario-mobile
        run: npm run lint

      - name: Prettier check
        working-directory: lecionario-mobile
        run: npx prettier --check "src/**/*.{ts,tsx,json}"

      - name: Tests
        working-directory: lecionario-mobile
        run: npm run test

      - name: Audit dependencies (production, com allowlist)
        run: node scripts/audit-allowlist.mjs mobile

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lecionario-web
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: lecionario-web
          file: lecionario-web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
