name: Deploy VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  # Gate: nada vai pra produção sem passar por aqui. Até 2026-10-01 o
  # `deploy` era disparado direto pelo push e fazia `git pull` + rebuild na
  # VPS — o `ci.yml` rodava em PARALELO, sem ninguém esperar. Commit
  # quebrado ia pra produção e o CI só avisava depois, sem impedir nada.
  verify:
    name: Verify (TypeCheck, Lint, Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # Dois `setup-node` porque o monorepo não tem lockfile na raiz: o cache
      # do setup-node procura um só e falharia. Mesma razão do `ci.yml`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lecionario-web/package-lock.json

      # Web
      - name: Install (web)
        working-directory: lecionario-web
        run: npm ci --legacy-peer-deps
      - name: TypeCheck (web)
        working-directory: lecionario-web
        run: npx tsc --noEmit
      - name: Lint (web)
        working-directory: lecionario-web
        run: npm run lint
      - name: Tests (web)
        working-directory: lecionario-web
        run: npm run test
      # Ambiente hostil: o mesmo teste que o `ci.yml` faz. Fica aqui porque
      # este é o gate real — se o pin de `NODE_ENV` sumir, o deploy para.
      - name: Tests com ambiente hostil (web)
        working-directory: lecionario-web
        env:
          NODE_ENV: production
          PUBLIC_ORIGIN: https://hostil.invalido
          DATABASE_URL: postgresql://invalido://x@hostil:9999/db
        run: npm run test

      # Mesmo gate de acessibilidade do ci.yml — fica aqui porque ESTE é o
      # portão real da produção (ver comentário do job lá em cima). O build
      # standalone é o que o webServer do playwright.config.ts sobe.
      - name: Install Playwright (Chromium)
        working-directory: lecionario-web
        run: npx playwright install --with-deps chromium
      - name: Build (standalone)
        working-directory: lecionario-web
        run: npm run build
      - name: E2E — acessibilidade (axe-core, WCAG 2.1 A/AA)
        working-directory: lecionario-web
        run: npx playwright test e2e/a11y.spec.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lecionario-mobile/package-lock.json

      # Mobile
      - name: Install (mobile)
        working-directory: lecionario-mobile
        run: npm ci --legacy-peer-deps
      - name: TypeCheck (mobile)
        working-directory: lecionario-mobile
        run: npx tsc --noEmit
      - name: Lint (mobile)
        working-directory: lecionario-mobile
        run: npm run lint
      - name: Tests (mobile)
        working-directory: lecionario-mobile
        run: npm run test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      # Falha fechada. A VPS faz `git pull --ff-only origin main`, que pega
      # a HEAD do branch — não o commit que os testes acabaram de verificar.
      # Se alguém subiu outro commit durante o `verify`, este passo aborta em
      # vez de publicar código não testado. O push seguinte traz o deploy de
      # volta (fail-closed: aborta, nunca publica errado).
      - name: Falha se a main avançou durante a verificação
        run: |
          HEAD_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "❌ main avançou durante a verificação (testado $GITHUB_SHA, branch $HEAD_SHA)."
            echo "   Deploy abortado para não publicar commit não verificado."
            exit 1
          fi
          echo "✅ HEAD da main == commit verificado (${GITHUB_SHA:0:7})"

      - name: Deploy no VPS (git pull + rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Guarda de disco (INCIDENTES.md no infra, 2026-08-23): aborta
            # antes de piorar se a raiz estiver >=90%.
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            if [ "$USO" -ge 90 ]; then
              echo "❌ Abortado: disco em ${USO}% (limite 90%). Rode: docker builder prune -af"
              exit 1
            fi
            cd /opt/lecionario
            git pull --ff-only origin main
            cd ~/hetzner-infra
            make deploy service=lecionario
            # Prune total pós-deploy (INCIDENTES.md 2026-08-23): sem filtro de
            # tempo — filtros semanais não pegam rajadas; e o prune simples (-f)
            # deixa registros compartilhados no disco (17,9GB invisíveis).
            docker builder prune -af >/dev/null
            docker image prune -f >/dev/null
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "✅ Deploy ok — disco em ${USO}%"

      - name: Smoke test
        run: |
          # Achado 2026-08-16: "sleep 3" fixo dava falso-negativo (container
          # às vezes ainda reiniciando) mesmo com o deploy tendo funcionado.
          # Retry de verdade: até 10 tentativas, 3s entre elas.
          for i in $(seq 1 10); do
            curl -sf -o /dev/null https://lecionario.narniano.com/ && break
            [ "$i" -eq 10 ] && exit 1
            sleep 3
          done
