name: EAS Update (OTA)

# Só publica OTA (JS/bundle) — não gera APK novo. Ver eas-build.yml pro
# job que gera binário nativo, disparado só quando algo que realmente
# precisa de build novo muda (não em toda mudança de código/dado JS).
# Motivo: rodar `eas build` (13min+ de CI) em mudanças puramente JS era
# desperdício de tempo e cota de build da Expo (achado 2026-08-21).

on:
  push:
    branches: [main]
    paths:
      - 'lecionario-mobile/src/**'
      - 'lecionario-mobile/app.config.ts'
      - 'lecionario-mobile/package.json'

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: EAS Update (OTA)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: lecionario-mobile
        run: npm ci --legacy-peer-deps

      - name: OTA Update
        working-directory: lecionario-mobile
        run: eas update --branch preview --message "Deploy ${{ github.sha }}"
