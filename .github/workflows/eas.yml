name: EAS Build & Update

on:
  push:
    branches: [main]
    paths:
      - 'lecionario-mobile/src/**'
      - 'lecionario-mobile/app.config.ts'
      - 'lecionario-mobile/package.json'

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: EAS Build (Android)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: lecionario-mobile
        run: npm ci --legacy-peer-deps

      - name: Build (Android preview)
        working-directory: lecionario-mobile
        run: eas build --platform android --profile preview --non-interactive
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  update:
    name: EAS Update (OTA)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: lecionario-mobile
        run: npm ci --legacy-peer-deps

      - name: OTA Update
        working-directory: lecionario-mobile
        run: eas update --branch preview --message "Deploy ${{ github.sha }}"
